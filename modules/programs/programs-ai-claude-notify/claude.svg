    <line x1="24" y1="24" x2="24"   y2="5"/>
    <line x1="24" y1="24" x2="31"   y2="11.9"/>
    <line x1="24" y1="24" x2="40.5" y2="14.5"/>
    <line x1="24" y1="24" x2="38"   y2="24"/>
    <line x1="24" y1="24" x2="40.5" y2="33.5"/>
    <line x1="24" y1="24" x2="31"   y2="36.1"/>
    <line x1="24" y1="24" x2="24"   y2="43"/>
    <line x1="24" y1="24" x2="17"   y2="36.1"/>
    <line x1="24" y1="24" x2="7.5"  y2="33.5"/>
    <line x1="24" y1="24" x2="10"   y2="24"/>
    <line x1="24" y1="24" x2="7.5"  y2="14.5"/>
    <line x1="24" y1="24" x2="17"   y2="11.9"/>
  </g>
