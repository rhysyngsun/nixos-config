[catppuccin-btop]
src.git = "https://github.com/catppuccin/btop"
fetch.github = "catppuccin/btop"

[catppuccin-godot]
src.git = "https://github.com/boranroni/godot-engine"
fetch.github = "boranroni/godot-engine"

[catppuccin-rofi]
src.git = "https://github.com/catppuccin/rofi"
fetch.github = "catppuccin/rofi"

[headlamp]
src.github = "kubernetes-sigs/headlamp"
src.prefix = "v"
fetch.url = "https://github.com/kubernetes-sigs/headlamp/releases/download/v$ver/Headlamp-$ver-linux-x64.AppImage"

# The engine is a Rust workspace under `rust/`. Track the release *source*
# tarball rather than the git repo: the checkout is ~185M of docs, SDKs and
# marketing, plus an `ssh://aur@...` submodule a sandboxed fetch cannot reach.
# The tarball is 13M and carries the same rust/ tree and its Cargo.lock.
# `pi-lean-ctx` on npm ships in lockstep with this version - bump both together.
[lean-ctx]
src.github = "yvgude/lean-ctx"
src.prefix = "v"
fetch.url = "https://github.com/yvgude/lean-ctx/releases/download/v$ver/lean-ctx-$ver-source.tar.gz"

[pkl-lsp]
src.github = "apple/pkl-lsp"
fetch.url = "https://github.com/apple/pkl-lsp/releases/download/$ver/pkl-lsp-$ver.jar"

[pkl-neovim]
src.git = "https://github.com/apple/pkl-neovim"
fetch.github = "apple/pkl-neovim"


[whichpy-nvim]
src.git = "https://github.com/neolooong/whichpy.nvim"
fetch.git = "https://github.com/neolooong/whichpy.nvim"


[nvim-treesitter]
src.git = "https://github.com/nvim-treesitter/nvim-treesitter"
src.branch = "main"
fetch.git = "https://github.com/nvim-treesitter/nvim-treesitter"

[tree-sitter-pkl]
src.git = "https://github.com/apple/tree-sitter-pkl"
fetch.git = "https://github.com/apple/tree-sitter-pkl"

[odl-agent-kit]
src.git = "https://github.com/mitodl/agent-kit.git"
# src.branch = "nl/standup-use-editor"
fetch.git = "https://github.com/mitodl/agent-kit.git"

# The release tag and the asset filename spell the version differently -
# `v0.1.800-beta` vs `Unsloth-Desktop-0_1_800_beta-Linux.AppImage` - and
# nvfetcher only substitutes a single `$ver`, so neither spelling alone can
# build the download URL. Track a *composite* version that carries both halves
# ("0.1.800-beta/Unsloth-Desktop-0_1_800_beta"), scraped straight out of the
# release JSON's own download URL, and split the real version back out in
# pkgs/unsloth.nix. Do not "simplify" this to src.github + prefix: it cannot
# produce the underscored filename.
[unsloth-studio]
src.webpage = "https://api.github.com/repos/unslothai/unsloth/releases/latest"
src.regex = "([0-9.]+-beta/Unsloth-Desktop-[0-9_]+_beta)"
fetch.url = "https://github.com/unslothai/unsloth/releases/download/v$ver-Linux.AppImage"

# Pinned manually, not tracked: witan shells out to this binary and expects the
# exact release named by `_OMNIGRAPH_VERSION` in
# packages/witan-core/witan_core/omnigraph_install.py. Bump the two together.
[omnigraph]
src.manual = "0.8.1"
fetch.url = "https://github.com/ModernRelay/omnigraph/releases/download/v$ver/omnigraph-linux-x86_64.tar.gz"
